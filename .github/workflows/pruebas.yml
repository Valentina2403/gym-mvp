name: Pruebas

on:
  push:
    branches: [main, develop, "release/**", "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas unitarias y de integración
        run: pytest -v --cov=app --cov-report=term --cov-fail-under=70 --html=reporte_pruebas.html --self-contained-html
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reporte_pruebas.html
